name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check
      - run: npm run test:subpath
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=mobile --project=desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: artifacts
          if-no-files-found: ignore
  container-recovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: |
          cp .env.example .env
          sed -i 's/BYTTES_AUTOMATISK_AV_INSTALLASJONEN/ci-only-database-password/' .env
          sed -i 's#https://timer.eksempel.no#http://127.0.0.1:4080#' .env
          sed -i 's/SECURE_COOKIES=true/SECURE_COOKIES=false/' .env
          sed -i "s/IMAGE_TAG=local/IMAGE_TAG=${GITHUB_SHA}/" .env
          mkdir -p backups
          touch backups/.kambuzi-timeforing-backups
      - run: docker compose config --quiet
      - run: docker buildx build --platform '${{ matrix.platform }}' --load --tag "kambuzi-timeforing:${GITHUB_SHA}" .
      - run: docker pull --platform '${{ matrix.platform }}' postgres:17.7-bookworm
      - run: docker compose up -d --no-build --wait
      - run: ./scripts/backup.sh --retention-days 30
      - run: |
          archive=$(find backups -maxdepth 1 -name '*.dump' -type f | head -n 1)
          CONFIRM_RESTORE=YES ./scripts/restore.sh "$archive"
      - run: ./scripts/status.sh
      - run: |
          mkdir -p image-artifact
          image="kambuzi-timeforing:${GITHUB_SHA}"
          database_image="postgres:17.7-bookworm"
          docker image inspect "$image" >/dev/null
          docker image inspect "$database_image" >/dev/null
          docker save "$image" "$database_image" | gzip -n -1 > "image-artifact/kambuzi-timeforing-images-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz"
          gzip -t "image-artifact/kambuzi-timeforing-images-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz"
          (cd image-artifact && sha256sum *.tar.gz > "kambuzi-timeforing-images-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-image-${{ matrix.arch }}
          path: image-artifact/*
      - if: always()
        run: docker compose logs --no-color
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: npm ci
      - run: ./scripts/build-release.sh release-a
      - run: ./scripts/build-release.sh release-b
      - run: |
          for file in release-a/*; do
            cmp "$file" "release-b/$(basename "$file")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-source
          path: release-a/*
