name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check
      - run: npm run test:subpath
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=mobile --project=desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: artifacts
          if-no-files-found: ignore
  container-recovery:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: |
          cp .env.example .env
          sed -i 's/BYTTES_AUTOMATISK_AV_INSTALLASJONEN/ci-only-database-password/' .env
          sed -i 's#https://timer.eksempel.no#http://127.0.0.1:4080#' .env
          sed -i 's/SECURE_COOKIES=true/SECURE_COOKIES=false/' .env
          sed -i "s/IMAGE_TAG=local/IMAGE_TAG=${GITHUB_SHA}/" .env
          mkdir -p backups
          touch backups/.kambuzi-timeforing-backups
      - run: docker compose config --quiet
      - run: docker buildx build --platform '${{ matrix.platform }}' --load --tag "kambuzi-timeforing:${GITHUB_SHA}" .
      - run: docker pull --platform '${{ matrix.platform }}' postgres:17.7-bookworm
      - run: |
          printf '%s\n' \
            'http://127.0.0.1:4080' \
            'CI testbedrift' \
            '999999999' \
            'CI' \
            'Administrator' \
            'admin@example.test' \
            'ci-only-admin-password' \
            'ci-only-admin-password' | \
            ./scripts/bootstrap.sh --image-tag "$GITHUB_SHA" --insecure-local
          docker compose exec -T app curl --fail --silent http://127.0.0.1:4000/api/setup/status | grep -q '"required":false'
      - run: |
          archive=$(find backups -maxdepth 1 -name '*.dump' -type f | head -n 1)
          CONFIRM_RESTORE=YES ./scripts/restore.sh "$archive"
      - run: ./scripts/status.sh
      - run: |
          mkdir -p image-artifact
          image="kambuzi-timeforing:${GITHUB_SHA}"
          database_image="postgres:17.7-bookworm"
          docker image inspect "$image" >/dev/null
          docker image inspect "$database_image" >/dev/null
          docker save "$image" "$database_image" | gzip -n -1 > "image-artifact/kambuzi-timeforing-images-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz"
          gzip -t "image-artifact/kambuzi-timeforing-images-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz"
          (cd image-artifact && sha256sum *.tar.gz > "kambuzi-timeforing-images-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz.sha256")
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: image-artifact/*
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-image-${{ matrix.arch }}
          path: image-artifact/*
      - if: always()
        run: docker compose logs --no-color
  upgrade-from-beta2:
    runs-on: ubuntu-24.04
    env:
      BETA2_SHA: 321dbedf7f79f9d70d6c59fa8fda536ef02550bd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - run: docker pull --platform linux/amd64 postgres:17.7-bookworm
      - run: |
          git checkout "$BETA2_SHA"
          cp .env.example .env
          sed -i 's/BYTTES_AUTOMATISK_AV_INSTALLASJONEN/ci-only-database-password/' .env
          sed -i 's#https://timer.eksempel.no#http://127.0.0.1:4080#' .env
          sed -i 's/SECURE_COOKIES=true/SECURE_COOKIES=false/' .env
          sed -i "s/IMAGE_TAG=local/IMAGE_TAG=${BETA2_SHA}/" .env
          mkdir -p backups
          touch backups/.kambuzi-timeforing-backups
      - run: docker buildx build --platform linux/amd64 --load --tag "kambuzi-timeforing:${BETA2_SHA}" .
      - run: docker compose up -d --no-build --wait
      - run: ./scripts/backup.sh --retention-days 30
      - run: |
          git checkout "$GITHUB_SHA"
          sed -i "s/IMAGE_TAG=${BETA2_SHA}/IMAGE_TAG=${GITHUB_SHA}/" .env
          docker buildx build --platform linux/amd64 --load --tag "kambuzi-timeforing:${GITHUB_SHA}" .
      - run: ./scripts/upgrade.sh "$GITHUB_SHA"
      - run: ./scripts/status.sh
      - if: always()
        run: docker compose logs --no-color
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: npm ci
      - run: ./scripts/build-release.sh release-a
      - run: ./scripts/build-release.sh release-b
      - run: |
          for file in release-a/*; do
            cmp "$file" "release-b/$(basename "$file")"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-a/*
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-source
          path: release-a/*
  offline-installer:
    needs: [container-recovery, release]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-source
          path: artifacts/source
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-image-${{ matrix.arch }}
          path: artifacts/image
      - run: |
          version=$(node -p "require('./package.json').version")
          short_sha=$(git rev-parse --short=12 HEAD)
          root="kambuzi-timeforing-$version"
          mkdir -p bundle
          source_archive=$(find artifacts/source -maxdepth 1 -name '*-source.tar.gz' -type f -print -quit)
          test -n "$source_archive"
          tar -xzf "$source_archive" -C bundle
          mkdir -p "bundle/$root/offline"
          cp artifacts/image/*.tar.gz artifacts/image/*.sha256 "bundle/$root/offline/"
          find "bundle/$root" -exec touch -h -d '@0' {} +
          output="kambuzi-timeforing-$version-$short_sha-${{ matrix.arch }}-offline.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C bundle -cf - "$root" | gzip -n -9 > "$output"
          sha256sum "$output" > "$output.sha256"
          gzip -t "$output"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: kambuzi-timeforing-*-offline.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: offline-installer-${{ matrix.arch }}
          path: |
            kambuzi-timeforing-*-offline.tar.gz
            kambuzi-timeforing-*-offline.tar.gz.sha256
