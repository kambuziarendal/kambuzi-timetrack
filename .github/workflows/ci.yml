name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check
      - run: npm run test:subpath
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=mobile --project=desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: artifacts
          if-no-files-found: ignore
  container-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          sed -i 's/BYTTES_AUTOMATISK_AV_INSTALLASJONEN/ci-only-database-password/' .env
          sed -i 's#https://timer.eksempel.no#http://127.0.0.1:4080#' .env
          sed -i 's/SECURE_COOKIES=true/SECURE_COOKIES=false/' .env
          mkdir -p backups
          touch backups/.kambuzi-timeforing-backups
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: ./scripts/backup.sh
      - run: |
          archive=$(find backups -maxdepth 1 -name '*.dump' -type f | head -n 1)
          CONFIRM_RESTORE=YES ./scripts/restore.sh "$archive"
      - run: curl --fail http://127.0.0.1:4080/health/ready
      - if: always()
        run: docker compose logs --no-color
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: npm ci
      - run: ./scripts/build-release.sh release-a
      - run: ./scripts/build-release.sh release-b
      - run: cmp release-a/*.tar.gz release-b/*.tar.gz
      - run: cmp release-a/*.sha256 release-b/*.sha256
      - run: cmp release-a/*.sbom.json release-b/*.sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-package
          path: release-a/*
